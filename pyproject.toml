[project]
name = "btclab"
version = "0.1.0"
description = "Price and trade Kalshi's Bitcoin prediction markets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "requests>=2.31", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2.1"]

[project.scripts]
btclab = "btclab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["btclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
